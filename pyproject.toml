[project]
name = "py-peer"
version = "0.1.0"
description = "Python implementation of the Universal Connectivity peer and p2p chat experience."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "textual>=0.47.0",
    "libp2p @ git+https://github.com/sumanjeet0012/py-libp2p.git@bitswap-payment",
    "trio>=0.22.0",
    "base58",
    "protobuf>=6.32.1",
    "janus>=1.0.0",
    "trio_asyncio",
    "kivy>=2.3.0",
    "kivymd>=1.2.0",
    "python-dotenv>=1.2.2",
    "groq>=1.0.0",
    "tornado>=6.5.5",
    "eth-account>=0.8.0",
    "coinbase-agentkit>=0.7.4"
]

[project.optional-dependencies]
ai = [
    "chromadb",
    "langchain",
    "langchain-community",
    "langchain-chroma",
    "langchain-huggingface",
    "langchain-text-splitters",
    "sentence-transformers",
    "einops"
]

[project.scripts]
py-peer = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.metadata]
allow-direct-references = true